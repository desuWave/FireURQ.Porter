name: MS FireURQ standalone

on:
  push:
    branches:
      - chan989/ms-fireurq-standalone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build translator
        run: dotnet build FireURQ.Porter.csproj --configuration Release --nologo

      - name: Build generated standalone (diagnostic; failures expected)
        id: standalone
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build Standalone/FireURQ/FireURQ.csproj --configuration Release --nologo -p:FireURQSourceRoot="$GITHUB_WORKSPACE/.fireurq-work/MS-03.9/translation-output" > standalone-build.log 2>&1
          result=$?
          echo "Standalone build exit code: $result"
          grep -m 15 -E 'error CS[0-9]+' standalone-build.log || true
          exit "$result"

      - name: Publish standalone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-log
          path: standalone-build.log
          if-no-files-found: warn
          retention-days: 14
