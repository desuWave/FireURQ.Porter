name: QSZ diagnostic on Windows

on:
  push:
    branches: [chan989/d3d8-render-target]
    paths:
      - .github/workflows/qsz-windows.yml
      - Tools/VerifyGeneratedProject.ps1
      - Tools/TestGeneratedQuestLoader.ps1
      - Tools/ShowD3D8RenderTexture.ps1

permissions:
  contents: read

jobs:
  qsz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/checkout@v4
        with:
          repository: fireton/fireurq
          ref: master
          path: .fireurq-work/fireurq-master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fireton/d2dge
          ref: furq_2_2_4
          path: .fireurq-work/d2dge-furq_2_2_4
          persist-credentials: false
      - name: Verify generated QSZ loader
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fireurq = (Resolve-Path '.fireurq-work/fireurq-master').Path
          $d2dge = (Resolve-Path '.fireurq-work/d2dge-furq_2_2_4').Path
          $sources = @($fireurq, $d2dge)
          $report = @(& ./Tools/VerifyGeneratedProject.ps1 -SourceRoots $sources 6>&1 |
              ForEach-Object { [string]$_ -split '\r?\n' })
          $directoryLine = $report | Where-Object { $_ -like 'Verification directory:*' } | Select-Object -First 1
          if (!$directoryLine) { throw ($report -join [Environment]::NewLine) }
          $directory = ($directoryLine -replace '^Verification directory:[ \t]*', '').Trim()
          $xmlPath = Join-Path $directory 'qsz-diagnostic.xml'
          $quest = Join-Path $fireurq 'tests/ver1.8/167.includes/167.includes.qsz'
          & powershell.exe -NoProfile -File ./Tools/TestGeneratedQuestLoader.ps1 -VerificationDirectory $directory -QuestPath $quest -ExportLocations $xmlPath
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $xmlPath)) {
              throw 'QSZ diagnostic export failed.'
          }
          $diagnostics = @(Select-Xml -LiteralPath $xmlPath -XPath '/quest/diagnostic')
          if ($diagnostics.Count -ne 1 -or $diagnostics[0].Node.InnerText -notmatch '\bbla\.qst\b') {
              throw 'Expected one diagnostic for bla.qst.'
          }
          Write-Host 'PASS: Windows QSZ diagnostic export.'
          $commentQuest = Join-Path $fireurq 'tests/ver1.8/201.comment_error.qst'
          $commentXml = Join-Path $directory 'comment-quest.xml'
          & powershell.exe -NoProfile -File ./Tools/TestGeneratedQuestLoader.ps1 -VerificationDirectory $directory -QuestPath $commentQuest -ExportLocations $commentXml
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $commentXml)) {
              throw 'Implicit quest entry export failed.'
          }
          $lines = @(Select-Xml -LiteralPath $commentXml -XPath '/quest/location[@name="0"]/line')
          if ($lines.Count -ne 1 -or $lines[0].Node.InnerText -cne 'hello, world!') {
              throw 'Expected hello, world! at the implicit entry.'
          }
          Write-Host 'PASS: quest without an explicit starting label.'
          $decorQuest = Join-Path $fireurq 'tests/ver1.8/206.linkdeco.qst'
          $decorXml = Join-Path $directory 'text-decoration.xml'
          & powershell.exe -NoProfile -File ./Tools/TestGeneratedQuestLoader.ps1 -VerificationDirectory $directory -QuestPath $decorQuest -ExportLocations $decorXml
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $decorXml)) {
              throw 'Text decoration export failed.'
          }
          $decor = @(Select-Xml -LiteralPath $decorXml -XPath '/quest/location[@name="0"]/text-decoration[@id="test" and @x="100" and @y="100"]')
          if ($decor.Count -ne 1 -or !$decor[0].Node.InnerText.Contains('|!blendtext]]')) {
              throw 'Expected the positioned text decoration and its link in the author fixture.'
          }
          $fade = @(Select-Xml -LiteralPath $decorXml -XPath '/quest/location[@name="blendtext"]/decoration-color[@id="test" and @duration="2000"]')
          if ($fade.Count -ne 1 -or $fade[0].Node.GetAttribute('color') -ine 'C1968A' -or
              $fade[0].Node.GetAttribute('link-color') -ine 'C2BB47') {
              throw 'Expected the timed body and link colors in the author fixture.'
          }
          $vulcanoQuest = Join-Path $fireurq 'tests/ver1.8.1/AV_Vulcano.qst'
          $vulcanoXml = Join-Path $directory 'vulcano.xml'
          & powershell.exe -NoProfile -File ./Tools/TestGeneratedQuestLoader.ps1 -VerificationDirectory $directory -QuestPath $vulcanoQuest -ExportLocations $vulcanoXml
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $vulcanoXml)) {
              throw 'Vulcano startup export failed.'
          }
          $entry = (Select-Xml -LiteralPath $vulcanoXml -XPath '/quest/location[@name="0"]').Node
          $intro = $entry.SelectSingleNode('line[not(@button)]')
          if ($intro -eq $null -or $intro.InnerText.Length -lt 300 -or
              $entry.SelectNodes('line[@button="true"]').Count -ne 1 -or
              $entry.SelectNodes('inventory-add').Count -ne 1) {
              throw 'Expected the Vulcano introduction, combat button and inventory item.'
          }
          $battle = (Select-Xml -LiteralPath $vulcanoXml -XPath '/quest/location[@name="Вбой"]').Node
          $battleLines = @($battle.SelectNodes('line') | ForEach-Object { $_.InnerText })
          if ($battleLines -notcontains 'БОЙ!' -or
              $battleLines -notcontains 'Ваш противник - Большая пиявка. Сила: 9.' -or
              $battle.SelectNodes('line[@button="true"]').Count -ne 2) {
              throw 'Expected the Vulcano combat introduction and both action buttons.'
          }
