name: Build and Translation Smoke Test

on:
  push:
    branches:
      - main
      - "chan989/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-translation-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build FireURQ.Porter.csproj --configuration Release

      - name: Run translation fixture
        run: dotnet run --project FireURQ.Porter.csproj --configuration Release --no-build -- --translate-test
